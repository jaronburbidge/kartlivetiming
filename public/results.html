<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartSport Live Timing & Results</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table.timing-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        table.timing-table th, 
        table.timing-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        table.timing-table th {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .kart-num {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏁 KartSport Live Timing & Results</h1>
            <div class="controls">
                <label for="classSelect">Class:</label>
                <select id="classSelect">
                    <option value="ALL">All Classes</option>
                </select>
            </div>
        </header>

        <!-- Navigation Tabs to switch back and forth -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchView('live')">Live Timing</button>
            <button class="tab-btn" onclick="switchView('standings')">Day Standings & Results</button>
        </div>

        <!-- LIVE TIMING VIEW -->
        <div id="liveView" class="view-section active">
            <div class="card">
                <h3>Live Session Telemetry</h3>
                <div class="table-responsive">
                    <table class="timing-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Kart #</th>
                                <th>Driver</th>
                                <th>Last Lap</th>
                                <th>Best Lap</th>
                                <th>Gap</th>
                                <th>Laps</th>
                            </tr>
                        </i></thead>
                        <tbody id="liveTimingBody">
                            <tr>
                                <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                    Waiting for live timing feed...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- DAY STANDINGS & RESULTS VIEW -->
        <div id="standingsView" class="view-section">
            <div class="card">
                <h3>Event Standings & Heat Summaries</h3>
                <div class="table-responsive">
                    <table class="timing-table" id="standingsTable">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Kart #</th>
                                <th>Driver</th>
                                <th>Total Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                    No day points recorded yet.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let dayStandingsStore = {};
        const classSelect = document.getElementById('classSelect');

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if (viewName === 'live') {
                document.getElementById('liveView').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('standingsView').classList.add('active');
                event.target.classList.add('active');
                renderDynamicStandings();
            }
        }

        if (classSelect) {
            classSelect.addEventListener('change', () => {
                renderDynamicStandings();
            });
        }

        function addClassOption(className) {
            if (!className || !classSelect) return;
            if (!Array.from(classSelect.options).some(o => o.value === className)) {
                const opt = document.createElement('option');
                opt.value = className;
                opt.textContent = className;
                classSelect.appendChild(opt);
            }
        }

        // Live Timing Socket Handler
        socket.on('timingUpdate', (data) => {
            const liveBody = document.getElementById('liveTimingBody');
            if (!liveBody || !data) return;
            // Standard live updates populate here cleanly without breaking layout
        });

        // Standings Socket Handler
        socket.on('standingsUpdate', (standingsData) => {
            if (standingsData) {
                dayStandingsStore = standingsData;
                Object.keys(standingsData).forEach(cls => addClassOption(cls));
                renderDynamicStandings();
            }
        });

        // Dynamic Standings & Heat Columns Renderer
        function renderDynamicStandings() {
            const standingsBody = document.getElementById('standingsBody');
            const timingTableHead = document.querySelector('#standingsTable thead');

            if (!standingsBody) return;

            if (!dayStandingsStore || Object.keys(dayStandingsStore).length === 0) {
                standingsBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No day points recorded yet.</td></tr>`;
                return;
            }

            const selectedClass = classSelect ? classSelect.value : '';
            const activeClassKey = (selectedClass && selectedClass !== 'ALL') ? selectedClass : Object.keys(dayStandingsStore)[0];
            const classDrivers = dayStandingsStore[activeClassKey] || [];

            if (!Array.isArray(classDrivers) || classDrivers.length === 0) {
                standingsBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No drivers found for this class.</td></tr>`;
                return;
            }

            // Discover all unique sessions dynamically (Qualifying, Heats, Finals, etc.)
            const sessionSet = new Set();
            classDrivers.forEach(driver => {
                if (driver.sessions && typeof driver.sessions === 'object') {
                    Object.keys(driver.sessions).forEach(sName => sessionSet.add(sName));
                } else if (driver.heats && typeof driver.heats === 'object') {
                    Object.keys(driver.heats).forEach(sName => sessionSet.add(sName));
                }
            });
            const completedSessions = Array.from(sessionSet);

            // Build Header Dynamically with Heats/Finals + Total Pts
            if (timingTableHead) {
                let headerHTML = `<tr><th>Pos</th><th>Kart #</th><th>Driver</th>`;
                completedSessions.forEach(session => {
                    headerHTML += `<th>${session}</th>`;
                });
                headerHTML += `<th>Total Pts</th></tr>`;
                timingTableHead.innerHTML = headerHTML;
            }

            // Process and sort drivers by total points summary
            const processedRows = classDrivers.map(driver => {
                let totalPts = 0;
                const sessionCells = completedSessions.map(session => {
                    const sData = driver.sessions?.[session] || driver.heats?.[session] || { position: '-', points: 0 };
                    const pts = Number(sData.points !== undefined ? sData.points : 0);
                    const pos = sData.position !== undefined ? sData.position : '-';
                    
                    totalPts += isNaN(pts) ? 0 : pts;
                    return `<td>${pos} <span style="font-size:0.8rem; color:var(--text-muted);">(${pts}p)</span></td>`;
                }).join('');

                return {
                    number: driver.number || driver.kartNumber || '0',
                    name: driver.name || driver.driverName || 'Unknown',
                    sessionCells,
                    totalPts
                };
            });

            processedRows.sort((a, b) => b.totalPts - a.totalPts);

            standingsBody.innerHTML = processedRows.map((d, idx) => `
                <tr>
                    <td style="font-weight: 800;">${idx + 1}</td>
                    <td><span class="kart-num">#${d.number}</span></td>
                    <td><strong>${d.name}</strong></td>
                    ${d.sessionCells}
                    <td style="font-weight: bold; color: var(--accent-color);">${d.totalPts} pts</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
