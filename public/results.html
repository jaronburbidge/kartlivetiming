<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartSport Live Timing & Results</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-red: #e63946;
            --accent-gold: #ffd700;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-red); padding-bottom: 15px; margin-bottom: 20px; }
        .club-title { text-transform: uppercase; font-size: 1.8rem; font-weight: 800; color: var(--accent-red); }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #e63946; }
        .status-dot.connected { background-color: #2ea44f; box-shadow: 0 0 8px #2ea44f; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--accent-red); border-color: var(--accent-red); }

        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 15px; }
        select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 6px; font-size: 0.95rem; outline: none; cursor: pointer; }
        select:focus { border-color: var(--accent-red); }

        .podium-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .podium-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; text-align: center; }
        .podium-card.p1 { border-top: 4px solid var(--accent-gold); }

        .table-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #1c2128; padding: 12px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 12px; border-top: 1px solid var(--border-color); font-size: 0.95rem; }
        .kart-col { color: var(--accent-red); font-weight: bold; }

        .pulse-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; height: fit-content; }
        .pulse-header { font-size: 1.1rem; font-weight: 800; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; color: var(--accent-gold); display: flex; justify-content: space-between; }
        .pulse-item { background: #1c2128; border-left: 4px solid var(--accent-red); border-radius: 4px; padding: 10px; margin-bottom: 10px; font-size: 0.85rem; }
        .pulse-item.fastest-lap { border-left-color: var(--accent-gold); }
        .pulse-title { font-weight: bold; margin-bottom: 2px; }
        .pulse-time { font-size: 0.75rem; color: var(--text-muted); float: right; }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="club-title" id="clubTitle">Timing & Results</div>
            <div class="subtitle" id="sessionTitle">Live Race Telemetry & Track Pulse</div>
        </div>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabLive" onclick="switchTab('live')">🏎️ Live Telemetry</button>
        <button class="tab-btn" id="tabPoints" onclick="switchTab('points')">🏆 Day Points Standings</button>
    </div>

    <div class="main-layout">
        <div>
            <!-- DUAL DROPDOWN CONTROLS: CLASS & HEAT/SESSION -->
            <div class="controls">
                <select id="classSelect" onchange="onClassChange()">
                    <option value="">-- Select Class --</option>
                </select>
                <select id="sessionSelect" onchange="onSessionChange()">
                    <option value="">-- Select Heat / Race --</option>
                </select>
            </div>

            <!-- LIVE / SESSION TIMING VIEW -->
            <div id="viewLive">
                <div class="podium-container" id="podiumContainer"></div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Pos</th><th>Kart #</th><th>Driver</th><th>Laps</th><th>Best Lap</th><th>Gap</th></tr>
                        </thead>
                        <tbody id="timingTableBody">
                            <tr><td colspan="6" style="text-align:center; padding: 20px;">Select a class and heat to view results.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- DAY POINTS VIEW -->
            <div id="viewPoints" style="display: none;">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Rank</th><th>Kart #</th><th>Driver</th><th>Total Points</th></tr>
                        </thead>
                        <tbody id="pointsTableBody">
                            <tr><td colspan="4" style="text-align:center; padding: 20px;">No overall points recorded for this class yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TRACK PULSE SIDEBAR -->
        <div class="pulse-panel">
            <div class="pulse-header">
                <span>⚡ Track Pulse</span>
                <span style="font-size:0.8rem; color: var(--text-muted);">Real-time Highlights</span>
            </div>
            <div id="pulseFeed"><div style="color: var(--text-muted); font-size: 0.85rem;">Listening for live events...</div></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clubId = urlParams.get('club') || 'auckland';
        document.getElementById('clubTitle').textContent = `${clubId.replace('-', ' ')} Kart Club`;

        // Telemetry Store: { [className]: { [sessionName]: { className, session, drivers } } }
        let telemetryStore = {};
        let pointsDataStore = {};
        
        let activeClass = '';
        let activeSession = '';
        let currentTab = 'live';

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}?club=${clubId}`;
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Live • Connected';
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'clear') {
                        telemetryStore = {};
                        pointsDataStore = {};
                        updateDropdowns();
                        renderBoard(null);
                        return;
                    }

                    if (data.type === 'heat' || (data.className && data.drivers)) {
                        const cName = data.className;
                        const sName = data.session || 'Heat 1';

                        if (!telemetryStore[cName]) telemetryStore[cName] = {};
                        telemetryStore[cName][sName] = data;

                        // Auto-select initial class and heat if not selected
                        if (!activeClass) activeClass = cName;
                        if (!activeSession || activeClass === cName) activeSession = sName;

                        updateDropdowns();

                        if (activeClass === cName && activeSession === sName) {
                            renderBoard(data);
                        }
                    } else if (data.type === 'pulse') {
                        renderPulse(data.events);
                    } else if (data.type === 'points') {
                        pointsDataStore[data.className] = data.standings;
                        if (activeClass === data.className) renderPoints(data.standings);
                    }
                } catch (e) { console.error(e); }
            };

            socket.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabLive').classList.toggle('active', tab === 'live');
            document.getElementById('tabPoints').classList.toggle('active', tab === 'points');
            document.getElementById('viewLive').style.display = tab === 'live' ? 'block' : 'none';
            document.getElementById('viewPoints').style.display = tab === 'points' ? 'block' : 'none';
            if (tab === 'points' && pointsDataStore[activeClass]) renderPoints(pointsDataStore[activeClass]);
        }

        function updateDropdowns() {
            const classSelect = document.getElementById('classSelect');
            const sessionSelect = document.getElementById('sessionSelect');

            // 1. Populate Class Dropdown
            const classes = Object.keys(telemetryStore);
            const currentSelectedClass = classSelect.value || activeClass;
            
            classSelect.innerHTML = '';
            classes.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls; opt.textContent = cls;
                classSelect.appendChild(opt);
            });

            if (classes.includes(currentSelectedClass)) {
                classSelect.value = currentSelectedClass;
                activeClass = currentSelectedClass;
            }

            // 2. Populate Heat/Session Dropdown for Active Class
            sessionSelect.innerHTML = '';
            if (activeClass && telemetryStore[activeClass]) {
                const sessions = Object.keys(telemetryStore[activeClass]);
                const currentSelectedSession = sessionSelect.value || activeSession;

                sessions.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s; opt.textContent = s;
                    sessionSelect.appendChild(opt);
                });

                if (sessions.includes(currentSelectedSession)) {
                    sessionSelect.value = currentSelectedSession;
                    activeSession = currentSelectedSession;
                } else if (sessions.length > 0) {
                    activeSession = sessions[sessions.length - 1]; // Pick latest
                    sessionSelect.value = activeSession;
                }
            }
        }

        function onClassChange() {
            activeClass = document.getElementById('classSelect').value;
            updateDropdowns();
            if (telemetryStore[activeClass] && telemetryStore[activeClass][activeSession]) {
                renderBoard(telemetryStore[activeClass][activeSession]);
            }
            if (pointsDataStore[activeClass]) renderPoints(pointsDataStore[activeClass]);
        }

        function onSessionChange() {
            activeSession = document.getElementById('sessionSelect').value;
            if (telemetryStore[activeClass] && telemetryStore[activeClass][activeSession]) {
                renderBoard(telemetryStore[activeClass][activeSession]);
            }
        }

        function renderBoard(data) {
            if (!data) {
                document.getElementById('sessionTitle').textContent = 'Live Race Telemetry & Track Pulse';
                document.getElementById('podiumContainer').innerHTML = '';
                document.getElementById('timingTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">No active timing data available.</td></tr>';
                return;
            }

            document.getElementById('sessionTitle').textContent = `${data.className} - ${data.session}`;
            const drivers = data.drivers || [];
            
            // Podium Cards
            const podiumContainer = document.getElementById('podiumContainer');
            podiumContainer.innerHTML = '';
            drivers.slice(0, 3).forEach((d, i) => {
                const card = document.createElement('div');
                card.className = `podium-card ${i===0?'p1':''}`;
                card.innerHTML = `<div style="font-weight:bold;">P${i+1} - #${d.number} ${d.name}</div><div style="font-size:0.8rem; color:var(--text-muted);">Best: ${d.bestLap}</div>`;
                podiumContainer.appendChild(card);
            });

            // Table
            document.getElementById('timingTableBody').innerHTML = drivers.map((d, i) => `
                <tr><td>${i+1}</td><td class="kart-col">#${d.number}</td><td>${d.name}</td><td>${d.laps}</td><td>${d.bestLap}</td><td>${d.gap}</td></tr>
            `).join('');
        }

        function renderPulse(events) {
            const feed = document.getElementById('pulseFeed');
            feed.innerHTML = events.map(e => `
                <div class="pulse-item ${e.badge || ''}">
                    <span class="pulse-time">${e.timestamp}</span>
                    <div class="pulse-title">${e.title}</div>
                    <div>${e.text}</div>
                </div>
            `).join('');
        }

        function renderPoints(standings) {
            const tbody = document.getElementById('pointsTableBody');
            if (!standings || standings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">No overall points recorded for this class yet.</td></tr>';
                return;
            }
            tbody.innerHTML = standings.map((s, i) => `
                <tr><td>${s.pos || i+1}</td><td class="kart-col">#${s.number}</td><td>${s.name}</td><td style="font-weight:bold; color:var(--accent-gold);">${s.points} pts</td></tr>
            `).join('');
        }

        connectWebSocket();
    </script>
</body>
</html>
