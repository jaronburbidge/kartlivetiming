<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartSport Live Timing & Telemetry</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-red: #e63946;
            --accent-green: #2ea44f;
            --accent-gold: #ffd700;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header Navigation */
        header { background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .brand h1 { font-size: 1.5rem; text-transform: uppercase; color: var(--accent-red); font-weight: 900; letter-spacing: 1px; }
        .brand p { font-size: 0.85rem; color: var(--text-muted); }
        
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: rgba(46, 164, 79, 0.15); border: 1px solid var(--accent-green); padding: 6px 12px; border-radius: 20px; color: var(--accent-green); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        /* Main Layout */
        .container { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; }
        
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Timing Board Panel */
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
        
        .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .session-title { font-size: 1.2rem; font-weight: 700; color: var(--accent-gold); }

        /* Table Design */
        .timing-table { width: 100%; border-collapse: collapse; text-align: left; }
        .timing-table th { padding: 12px; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        .timing-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        .timing-table tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        .pos-col { font-weight: 800; font-size: 1.1rem; width: 50px; }
        .kart-num { font-weight: 700; color: var(--accent-gold); background: rgba(255, 215, 0, 0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; }
        
        /* Delta Badges */
        .delta { font-weight: 700; font-size: 0.85rem; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .delta.up { color: var(--accent-green); background: rgba(46, 164, 79, 0.15); }
        .delta.down { color: var(--accent-red); background: rgba(230, 57, 70, 0.15); }
        .delta.same { color: var(--text-muted); }

        /* Track Pulse Panel */
        .pulse-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .pulse-feed { display: flex; flex-direction: column; gap: 10px; max-height: 700px; overflow-y: auto; }
        
        .pulse-card { background: var(--bg-dark); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-red); border-radius: 6px; padding: 12px; animation: fadeIn 0.3s ease-in; }
        .pulse-card.fastest-lap { border-left-color: var(--accent-gold); }
        .pulse-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .pulse-time { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; }
        .pulse-text { font-size: 0.9rem; color: var(--text-main); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 id="clubTitle">KartSport Telemetry</h1>
            <p>Live Race Telemetry & Track Pulse</p>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span id="connectionText">Live • Connected</span>
        </div>
    </header>

    <div class="container">
        <!-- Main Timing Board -->
        <div class="panel">
            <div class="session-header">
                <div class="session-title" id="sessionLabel">Select Class - Select Heat / Race</div>
            </div>

            <table class="timing-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Kart #</th>
                        <th>Driver</th>
                        <th>Gain / Loss</th>
                        <th>Laps</th>
                        <th>Best Lap</th>
                        <th>Gap</th>
                    </tr>
                </thead>
                <tbody id="timingBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            Waiting for live race telemetry feed...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Track Pulse Feed -->
        <div class="panel">
            <div class="pulse-header">
                <span>⚡ Track Pulse</span>
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Real-time Highlights</span>
            </div>
            <div class="pulse-feed" id="pulseFeed">
                <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">
                    Waiting for live track events...
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Get Club ID from URL Query String (?club=tokoroa)
        const urlParams = new URLSearchParams(window.location.search);
        const clubId = urlParams.get('club') || 'tokoroa';

        // 2. Club Title Mapping
        const clubNames = {
            'whangarei': 'KartSport Whangarei',
            'auckland': 'KartSport Auckland Mt Wellington',
            'hamilton': 'KartSport Hamilton',
            'tokoroa': 'KartSport Tokoroa',
            'bop': 'KartSport Bay of Plenty',
            'ebop': 'KartSport Eastern Bay of Plenty',
            'taranaki': 'KartSport Taranaki',
            'manawatu': 'KartSport Manawatu',
            'wellington': 'KartSport Wellington'
        };

        document.getElementById('clubTitle').textContent = clubNames[clubId] || `KartSport ${clubId.toUpperCase()}`;

        // 3. Socket.io Connection & Subscription
        const socket = io();

        socket.on('connect', () => {
            console.log('✅ Connected to WebSocket Server');
            document.getElementById('connectionText').textContent = 'Live • Connected';
            socket.emit('joinClub', clubId);
        });

        socket.on('disconnect', () => {
            console.warn('⚠️ Disconnected from server');
            document.getElementById('connectionText').textContent = 'Offline • Reconnecting';
        });

        // 4. Update Live Timing Board
        socket.on('heatUpdate', (data) => {
            if (!data) return;

            document.getElementById('sessionLabel').textContent = `${data.className || 'Unknown Class'} - ${data.session || 'Heat 1'}`;

            const tbody = document.getElementById('timingBody');
            if (!data.drivers || data.drivers.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            No active drivers on track for this session.
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = data.drivers.map((d, index) => {
                const currentPos = index + 1;
                const startPos = d.startPos || currentPos;
                const diff = startPos - currentPos; // Positive = gained positions

                let deltaHtml = '<span class="delta same">-</span>';
                if (diff > 0) {
                    deltaHtml = `<span class="delta up">▲ ${diff}</span>`;
                } else if (diff < 0) {
                    deltaHtml = `<span class="delta down">▼ ${Math.abs(diff)}</span>`;
                }

                return `
                    <tr>
                        <td class="pos-col">${currentPos}</td>
                        <td><span class="kart-num">#${d.number}</span></td>
                        <td><strong>${d.name}</strong></td>
                        <td>${deltaHtml}</td>
                        <td>${d.laps}</td>
                        <td>${d.bestLap}</td>
                        <td>${d.gap}</td>
                    </tr>
                `;
            }).join('');
        });

        // 5. Update Track Pulse Highlights
        socket.on('pulseEvent', (event) => {
            renderPulseCard(event, true);
        });

        socket.on('pulseHistory', (history) => {
            const feed = document.getElementById('pulseFeed');
            feed.innerHTML = '';
            if (!history || history.length === 0) {
                feed.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">Waiting for live track events...</div>`;
                return;
            }
            history.forEach(item => renderPulseCard(item, false));
        });

        socket.on('clearPulse', () => {
            document.getElementById('pulseFeed').innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">Waiting for live track events...</div>`;
        });

        function renderPulseCard(event, prepend = true) {
            const feed = document.getElementById('pulseFeed');
            
            // Remove empty placeholder text if present
            if (feed.children.length === 1 && feed.children[0].tagName === 'DIV' && !feed.children[0].classList.contains('pulse-card')) {
                feed.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = `pulse-card ${event.badge || ''}`;
            card.innerHTML = `
                <div class="pulse-title">
                    <span>${event.title || 'HIGHLIGHT'}</span>
                    <span class="pulse-time">${event.timestamp || ''}</span>
                </div>
                <div class="pulse-text">${event.text || ''}</div>
            `;

            if (prepend) {
                feed.insertBefore(card, feed.firstChild);
            } else {
                feed.appendChild(card);
            }

            // Keep feed max 20 items
            while (feed.children.length > 20) {
                feed.removeChild(feed.lastChild);
            }
        }
    </script>
</body>
</html>
