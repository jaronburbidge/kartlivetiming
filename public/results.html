<script>
    // ... (keep your existing urlParams, socket connection, and tab switching logic) ...

    let dayStandingsStore = {};
    const classSelect = document.getElementById('classSelect');

    classSelect.addEventListener('change', () => {
        renderDynamicStandings();
    });

    function addClassOption(className) {
        if (!className) return;
        if (!Array.from(classSelect.options).some(o => o.value === className)) {
            const opt = document.createElement('option');
            opt.value = className;
            opt.textContent = className;
            classSelect.appendChild(opt);
        }
    }

    // Listen for incoming standings / results updates from the bridge/backend
    socket.on('standingsUpdate', (standingsData) => {
        if (standingsData) {
            dayStandingsStore = standingsData;
            Object.keys(standingsData).forEach(cls => addClassOption(cls));
            renderDynamicStandings();
        }
    });

    /**
     * Dynamically discovers all completed sessions (e.g., Qualifying, Heats, Prefinal, Final)
     * and builds table headers/rows with an overall Total Points summary column.
     */
    function renderDynamicStandings() {
        const selectedClass = classSelect.value;
        const standingsBody = document.getElementById('standingsBody');
        const timingTableHead = document.querySelector('#standingsView .timing-table thead');

        if (!dayStandingsStore || Object.keys(dayStandingsStore).length === 0) {
            standingsBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted); padding: 40px;">No day points recorded yet. Points update as heats finish.</td></tr>`;
            return;
        }

        const activeClassKey = (selectedClass && selectedClass !== 'ALL') ? selectedClass : Object.keys(dayStandingsStore)[0];
        const classDrivers = dayStandingsStore[activeClassKey] || [];

        if (classDrivers.length === 0) {
            standingsBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted); padding: 40px;">Select a class to view standings.</td></tr>`;
            return;
        }

        // 1. Discover all unique session types sent by Orbits dynamically for this class
        const sessionSet = new Set();
        classDrivers.forEach(driver => {
            if (driver.sessions) {
                Object.keys(driver.sessions).forEach(sName => sessionSet.add(sName));
            }
        });
        const completedSessions = Array.from(sessionSet); // e.g. ["Qualifying", "Heat 1", "Heat 2", "Final"]

        // 2. Build Dynamic Table Header matching whatever Orbits sent
        let headerHTML = `<tr><th>Pos</th><th>Kart #</th><th>Driver</th>`;
        completedSessions.forEach(session => {
            headerHTML += `<th>${session}</th>`;
        });
        headerHTML += `<th>Total Pts</th></tr>`;
        timingTableHead.innerHTML = headerHTML;

        // 3. Calculate points and sort drivers by overall total points summary descending
        const processedRows = classDrivers.map(driver => {
            let totalPts = 0;
            const sessionCells = completedSessions.map(session => {
                const sData = driver.sessions?.[session] || { position: '-', points: 0 };
                const pts = sData.points || 0;
                totalPts += pts;
                return `<td>${sData.position} <span style="font-size:0.8rem; color:var(--text-muted);">(${pts}p)</span></td>`;
            }).join('');

            return {
                number: driver.number,
                name: driver.name,
                sessionCells,
                totalPts
            };
        });

        processedRows.sort((a, b) => b.totalPts - a.totalPts);

        // 4. Render Table Body
        standingsBody.innerHTML = processedRows.map((d, idx) => `
            <tr>
                <td style="font-weight: 800;">${idx + 1}</td>
                <td><span class="kart-num">#${d.number}</span></td>
                <td><strong>${d.name}</strong></td>
                ${d.sessionCells}
                <td class="total-pts">${d.totalPts} pts</td>
            </tr>
        `).join('');
    }
</script>
