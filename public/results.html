<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartSport Live Timing & Results</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-red: #e63946;
            --accent-gold: #ffd700;
            --accent-silver: #c0c0c0;
            --accent-bronze: #cd7f32;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-red); padding-bottom: 15px; margin-bottom: 20px; }
        .club-title { text-transform: uppercase; font-size: 1.8rem; font-weight: 800; color: var(--accent-red); letter-spacing: 1px; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #e63946; }
        .status-dot.connected { background-color: #2ea44f; box-shadow: 0 0 8px #2ea44f; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 6px; font-size: 0.95rem; outline: none; cursor: pointer; }
        select:focus { border-color: var(--accent-red); }
        .podium-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .podium-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; }
        .podium-card.p1 { border-top: 4px solid var(--accent-gold); }
        .podium-card.p2 { border-top: 4px solid var(--accent-silver); }
        .podium-card.p3 { border-top: 4px solid var(--accent-bronze); }
        .podium-pos { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .p1 .podium-pos { color: var(--accent-gold); }
        .p2 .podium-pos { color: var(--accent-silver); }
        .p3 .podium-pos { color: var(--accent-bronze); }
        .podium-driver { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .podium-detail { font-size: 0.85rem; color: var(--text-muted); }
        .table-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #1c2128; padding: 12px 16px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }
        td { padding: 12px 16px; border-top: 1px solid var(--border-color); font-size: 0.95rem; }
        tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
        .pos-col { font-weight: 700; width: 60px; }
        .kart-col { font-weight: 700; color: var(--accent-red); width: 80px; }
        .driver-col { font-weight: 600; }
        .mono { font-family: monospace; }
        .no-data { text-align: center; padding: 40px; color: var(--text-muted); }
        @media (max-width: 768px) { .podium-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="club-title" id="clubTitle">Timing & Results</div>
            <div class="subtitle" id="sessionTitle">Live Telemetry Board</div>
        </div>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <div class="controls">
        <select id="classSelect" onchange="onClassChange()">
            <option value="">-- Select Class --</option>
        </select>
        <select id="sessionSelect">
            <option value="Heat 1">Heat 1</option>
        </select>
    </div>

    <div class="podium-container" id="podiumContainer"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="pos-col">Pos</th>
                    <th class="kart-col">Kart #</th>
                    <th>Driver</th>
                    <th>Laps</th>
                    <th>Best Lap</th>
                    <th>Gap</th>
                </tr>
            </thead>
            <tbody id="timingTableBody">
                <tr><td colspan="6" class="no-data">No active class selected or no data available.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clubId = urlParams.get('club') || 'auckland';
        document.getElementById('clubTitle').textContent = `${clubId.replace('-', ' ')} Kart Club`;

        let classDataStore = {};
        let activeClass = '';

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}?club=${clubId}`;
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Live • Connected';
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.className && data.drivers) {
                        handleIncomingData(data);
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket frame:', e);
                }
            };

            socket.onclose = () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Reconnecting...';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleIncomingData(data) {
            const className = data.className;
            classDataStore[className] = data;
            updateClassDropdown();

            if (!activeClass || activeClass === '') {
                activeClass = className;
                document.getElementById('classSelect').value = className;
            }

            if (activeClass === className) {
                renderBoard(data);
            }
        }

        function updateClassDropdown() {
            const select = document.getElementById('classSelect');
            const availableClasses = Object.keys(classDataStore);
            const currentVal = select.value;
            select.innerHTML = '';

            availableClasses.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                select.appendChild(opt);
            });

            if (currentVal && availableClasses.includes(currentVal)) {
                select.value = currentVal;
            } else if (activeClass) {
                select.value = activeClass;
            }
        }

        function onClassChange() {
            const select = document.getElementById('classSelect');
            activeClass = select.value;
            if (classDataStore[activeClass]) {
                renderBoard(classDataStore[activeClass]);
            }
        }

        function renderBoard(data) {
            document.getElementById('sessionTitle').textContent = `${data.className} - ${data.session || 'Live Session'}`;
            const drivers = data.drivers || [];
            
            const podiumContainer = document.getElementById('podiumContainer');
            podiumContainer.innerHTML = '';
            const top3 = drivers.slice(0, 3);
            const podiumClasses = ['p1', 'p2', 'p3'];

            top3.forEach((driver, idx) => {
                const card = document.createElement('div');
                card.className = `podium-card ${podiumClasses[idx]}`;
                card.innerHTML = `
                    <div class="podium-pos">P${idx + 1}</div>
                    <div class="podium-driver">#${driver.number} ${driver.name}</div>
                    <div class="podium-detail">Best: ${driver.bestLap || '-'} | Laps: ${driver.laps || 0}</div>
                `;
                podiumContainer.appendChild(card);
            });

            const tbody = document.getElementById('timingTableBody');
            if (drivers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No active timing data available.</td></tr>';
                return;
            }

            tbody.innerHTML = drivers.map((driver, index) => `
                <tr>
                    <td class="pos-col">${index + 1}</td>
                    <td class="kart-col">#${driver.number}</td>
                    <td class="driver-col">${driver.name}</td>
                    <td class="mono">${driver.laps || 0}</td>
                    <td class="mono">${driver.bestLap || '-'}</td>
                    <td class="mono">${driver.gap || '-'}</td>
                </tr>
            `).join('');
        }

        connectWebSocket();
    </script>
</body>
</html>
